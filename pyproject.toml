[project]
name = "strata-local"
version = "0.1.44.1"
description = "Strata's local setup and Python server"
requires-python = ">=3.10"
dependencies = [
    "certifi==2026.7.22",
    "charset-normalizer==3.5.1",
    "cmake==4.4.3",
    "colorama==0.4.6 ; sys_platform == 'win32'",
    "httpx>=0.28,<1",
    # 中断ファイルへの追記・HTTP Range再開を確認した版に固定。
    "huggingface-hub==1.15.0",
    "idna==3.20",
    "jinja2==3.1.6",
    "markupsafe==3.0.3",
    "ninja==1.13.2",
    "numpy==2.2.6 ; python_full_version < '3.11'",
    "numpy==2.4.6 ; python_full_version == '3.11.*'",
    "numpy==2.5.3 ; python_full_version >= '3.12'",
    "pillow==12.3.0",
    "psutil==7.2.2",
    "pyyaml==6.0.3",
    "regex==2026.9.10",
    "requests==2.34.2",
    "tqdm==4.70.1",
    "truststore>=0.10,<1",
    "urllib3==2.8.0",
]

[project.optional-dependencies]
cuda13 = [
    "nvidia-cublas==13.0.2.14 ; sys_platform != 'darwin'",
    "nvidia-cuda-runtime==13.0.96 ; sys_platform != 'darwin'",
]
cuda12 = [
    "nvidia-cublas-cu12==12.9.1.4 ; sys_platform != 'darwin'",
    "nvidia-cuda-runtime-cu12==12.9.79 ; sys_platform != 'darwin'",
]

[tool.uv]
package = false
# Also trust corporate roots installed in the OS certificate store.
system-certs = true
